# Kit allowlists for agent/tool_surface.py
#
# Each key is a kit name; the value is an ordered list of tool names that
# the kit is permitted to expose to the model.  Tools not listed here are
# hidden when that kit is active.
#
# Adding a tool name that does not exist in the registry logs a warning
# but does not crash.

