# ============================================================================
# Retained Components
# This list is for reference - components that must NEVER be removed
# ============================================================================
retained_critical:
  agent_core:
    - "agent/conversation_loop.py"
    - "agent/prompt_builder.py"
    - "agent/system_prompt.py"
    - "agent/prompt_caching.py"
    - "agent/tool_executor.py"
    - "agent/tool_guardrails.py"
    - "agent/error_classifier.py"
  
  persistence:
    - "hermes_state.py"
    - "state.db and FTS5 indexes"
    - "Trajectory capture"
  
  memory_and_recall:
    - "agent/curator.py"
    - "agent/background_review.py"
    - "agent/memory_manager.py"
    - "plugins/memory/"
  
  gateways:
    - "gateway/platforms/discord.py"
    - "tui_gateway/"
    - "ui-tui/"
    - "gateway/session.py"
  
  skills:
    - "skills/research/"
    - "skills/software-development/"
    - "skills/devops/"
    - "skills/github/"
    - "skills/mcp/"
    - "skills/security/"
  
  providers:
