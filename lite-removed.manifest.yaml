    - "agent/copilot_acp_client.py"
    - "agent/chat_completion_helpers.py"

# ============================================================================
# Rebase Strategy
# ============================================================================
rebase_rules:
  conflict_resolution:
    - "If a conflict re-introduces a removed path, DROP the incoming change"
    - "Log dropped paths to rebase-conflict-report.txt"
    - "Surface as informational, not as merge failure"
  
  merge_strategy:
    - "Accept all updates to retained components"
    - "Auto-drop all changes touching removed paths"
    - "Preserve version numbers and schema changes in retained components"

# ============================================================================
# Integration Points That Must Verify After Rebase
# ============================================================================
integration_verification:
  - "No import of removed agent adapters"
  - "No registration of removed gateways in gateway/__init__.py"
  - "No removed skills loaded in toolsets.py"
  - "No removed providers in pyproject.toml extras"
  - "All removed paths absent from codebase via grep verification"
